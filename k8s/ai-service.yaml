apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service # ZMIEŃ NA: ai-service / chat-service / deck-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service # ZMIEŃ NA: ai-service / chat-service / deck-service
  template:
    metadata:
      labels:
        app: ai-service # ZMIEŃ NA: ai-service / chat-service / deck-service
    spec:
      containers:
        - name: ai-service # ZMIEŃ NA: ai-service / chat-service / deck-service
          image: dealmate-ai-service:v2 # PODMIEŃ OBRAZ
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.yml
              subPath: aiservice.yml # ZMIEŃ NA: aiservice.yml / chatservice.yml / deckservice.yml
      volumes:
        - name: config-volume
          configMap:
            name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service # ZMIEŃ NA: ai-service / chat-service / deck-service
spec:
  selector:
    app: ai-service # ZMIEŃ NA: ai-service / chat-service / deck-service
  ports:
    - port: 8080
