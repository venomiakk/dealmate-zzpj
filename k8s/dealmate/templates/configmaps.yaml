apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  aiservice.yml: |
    server:
      port: 8080
    spring:
      ai:
        openai:
          api-key: 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
    base_url: https://api.groq.com/openai/v1/chat/completions
    ai_model:  meta-llama/llama-4-scout-17b-16e-instruct
    ai_temperature:  0.7

  apigateway.yml: |
    server:
      port: 8080
    spring:
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://auth-server:9000/oauth2/jwks
          client:
            provider:
              platform-auth-server:
                issuer-uri: http://auth-server:9000
            registration:
              gateway-client:
                provider: platform-auth-server
                client-id: gateway-client
                client-secret: gateway-secret
                client-authentication-method: client_secret_basic
                authorization-grant-type: authorization_code
                redirect-uri: http://localhost:8080/login/oauth2/code/gateway-client
                scope:
                  - openid
                  - profile
                  - email
      cloud:
        gateway:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/userservice/**
              filters:
                - StripPrefix=1
                - TokenRelay

            - id: deck-service
              uri: http://deck-service:8080
              predicates:
                - Path=/deckservice/**
              filters:
                - StripPrefix=1

            - id: game-service
              uri: http://game-service:8080
              predicates:
                - Path=/gameservice/**
              filters:
                - StripPrefix=1
                - TokenRelay

            - id: chat-service
              uri: http://chat-service:8080
              predicates:
                - Path=/chatservice/**
              filters:
                - StripPrefix=1
                - TokenRelay

            - id: chat-websocket
              uri: http://chat-service:8080
              predicates:
                - Path=/ws-chat/**

            - id: game-websocket   # DODAJ TO
              uri: http://game-service:8080
              predicates:
                - Path=/ws-game/**

            - id: ai-service
              uri: http://ai-service:8080
              predicates:
                - Path=/aiservice/**
              filters:
                - StripPrefix=1
    logging:
      level:
        org.springframework.cloud.gateway: TRACE
        org.springframework.web: TRACE

  authserver.yml: |
    gateway:
      client:
        id: gateway-client
        secret: gateway-secret
        host:
          url: http://localhost:8080 # Tu przeglądarka wróci po zalogowaniu do Gateway
    public:
      client:
        id: public-client
        host:
          url: http://localhost # ZMIANA: Usunęliśmy :5173, bo Vue działa na domyślnym porcie 80
    server:
      port: 8080
    spring:
      security:
        oauth2:
          authserver:
            # Uwaga: Przeglądarka musi widzieć ten adres!
            issuer: http://127.0.0.1:9000
    logging:
      level:
        org.springframework.web: TRACE
        org.springframework.security: TRACE

  chatservice.yml: |
    server:
      port: 8080
    spring:
      datasource:
        url: jdbc:postgresql://postgres-service:5432/dealmatedb
        username: postgres
        password: 123
      jpa:
        hibernate:
          ddl-auto: update
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://auth-server:9000/oauth2/jwks
    logging:
      level:
        org.springframework.security: DEBUG
        org.springframework.security.authorization: TRACE

  deckservice.yml: |
    server:
      port: 8080
    spring:
      datasource:
        url: jdbc:postgresql://postgres-service:5432/dealmatedb
        username: postgres
        password: 123
      jpa:
        hibernate:
          ddl-auto: update
    deck:
      api:
        url: https://deckofcardsapi.com/api/deck/

  gameservice.yml: |
    server:
      port: 8080
    spring:
      datasource:
        url: jdbc:postgresql://postgres-service:5432/dealmatedb
        username: postgres
        password: 123
      jpa:
        hibernate:
          ddl-auto: update
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://auth-server:9000/oauth2/jwks

  userservice.yml: |
    server:
      port: 8080
    springdoc:
        api-docs:
          path: /api-docs
    spring:
      datasource:
        url: jdbc:postgresql://postgres-service:5432/dealmatedb
        username: postgres
        password: {{ .Values.global.dbPassword | quote }} # ZMIANA: Pobieramy hasło z wartości Helm
      jpa:
        hibernate:
          ddl-auto: update
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://auth-server:9000/oauth2/jwks

